backend:
  name: github
  repo: ShahradGH/boaesperanca-site
  branch: main
  base_url: https://boaesperanca.net
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"
site_url: "https://boaesperanca.net"

collections:
  - name: "posts"
    label: "Artigos / Posts"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data de Publicação", name: "pubDate", widget: "datetime" }
      - { label: "Categoria", name: "category", widget: "string", default: "Comunidade" }
      - { label: "Autor", name: "author", widget: "string", default: "Boa Esperança" }
      - { label: "Descrição", name: "description", widget: "text", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Páginas / Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "pubDate", widget: "datetime" }
      - { label: "Descrição", name: "description", widget: "text", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
