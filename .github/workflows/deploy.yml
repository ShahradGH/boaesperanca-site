name: Build, Verify & Deploy Boa Esperanca (Cloudflare Pages)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Astro Static Build, Functions Check, Tests & Cloudflare Pages Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Cloudflare Pages Functions
        run: npm run typecheck

      - name: Validate Cloudflare Pages Functions bundle
        run: npx --yes wrangler pages functions build functions --outdir .wrangler/functions-check

      - name: Build static Astro site
        run: npm run build

      - name: Run static build, Functions & Zero-Leak validation tests
        run: npm test

      - name: Deploy to Cloudflare Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$CLOUDFLARE_API_TOKEN" ] || [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID for Cloudflare Pages deploy."
              exit 1
            fi
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not configured in GitHub Secrets; skipping automated deploy."
            exit 0
          fi
          npx --yes wrangler pages deploy dist --project-name=boaesperanca-site
